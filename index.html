text:"رأيت رجلاً عجوزًا يجلس وحده كل يوم في نفس المكان ويتحدث مع نفسه.",
view:"كان يقرأ الرسائل القديمة التي كتبتها له زوجته قبل وفاتها، ويتخيل أنه ما زال يحادثها.",
choices:[
{
text:"اعتباره غريبًا",
result:"حكمت على المشهد دون معرفة قصته."
},
{
text:"السخرية منه",
result:"أضفت ألمًا إلى شخص يعيش ذكرياته."
},
{
text:"التفكير في سبب تصرفه",
result:"اكتشفت أن الحب والوفاء قد يبدوان غريبين أحيانًا."
}
]
}
];

let userCharacter =
localStorage.getItem("character") || "👧";
let current=0;

let completed =
Number(localStorage.getItem("completed")) || 0;

let points =
Number(localStorage.getItem("points")) || 0;

document.getElementById("completed").innerText =
completed;

document.getElementById("points").innerText =
points;

updateAchievement();

function startStory(index){

current=index;

document.getElementById("home")
.classList.add("hidden");

document.getElementById("story")
.classList.remove("hidden");

showStory();

}

function showStory(){

document.getElementById("storyTitle").innerText =
stories[current].title;

document.getElementById("storyImage").innerText =
stories[current].image;

document.getElementById("storyText").innerText =
stories[current].text;

document.getElementById("progressText").innerText =
"القصة " + (current+1) + " من " + stories.length;

let box =
document.getElementById("choices");

box.innerHTML="";

stories[current].choices.forEach(choice=>{

let btn =
document.createElement("button");

btn.innerText =
choice.text;

btn.onclick=function(){

document.getElementById("result").innerText =
choice.result;

document.getElementById("resultBox")
.classList.remove("hidden");

};

box.appendChild(btn);

});

document.getElementById("otherView")
.classList.add("hidden");

document.getElementById("resultBox")
.classList.add("hidden");

}

function swapView(){

let v =
document.getElementById("otherView");

v.classList.remove("hidden");

v.innerHTML =
"<div class='card'><strong>وجهة النظر الأخرى:</strong><br><br>"
+
stories[current].view
+
"</div>";

}

function nextStory(){

completed++;

points += 10;

document.getElementById("progressBar").value =
((current + 1) / stories.length) * 100;

localStorage.setItem(
"completed",
completed
);

localStorage.setItem(
"points",
points
);

document.getElementById("completed").innerText =
completed;

document.getElementById("points").innerText =
points;

updateAchievement();

if(current < stories.length-1){

current++;

showStory();

}else{

document.getElementById("story")
.classList.add("hidden");

document.getElementById("home")
.classList.remove("hidden");

let personality = "";

let secretMessage = "";

if(points >= 100){

secretMessage = `
<div class="card">

🎁 تم فتح القصة السرية

<br><br>

لأنك حصلت على أعلى مستوى من التعاطف.

</div>
`;

}

if(points >= 100){
personality = "🏆 بطل التعاطف";
}
else if(points >= 70){
personality = "⭐ باحث عن الحقيقة";
}
else if(points >= 40){
personality = "💛 مستمع جيد للآخرين";
}
else{
personality = "🌱 في بداية رحلة التعاطف";
}
document.body.innerHTML=`
<div class="screen">

<h1>${userCharacter} 🏆 تهانينا</h1>

<h2>👑 أصبحت بطل التعاطف</h2>

<p>⭐ النقاط: ${points}</p>

<p>
💖 درجة التعاطف الخاصة بك:
<b>${Math.min(100, points)}%</b>
</p>

<p>
🌟 شخصيتك:
<br><br>
<b>${personality}</b>
</p>

<p>📚 القصص المكتملة: ${completed}</p>

<p>
💙 قبل أن تحكم على أي شخص...
<br><br>
تذكر أن لكل إنسان قصة لا تعرفها.
<br><br>
وربما لو كنت مكانه...
لكنت فعلت الشيء نفسه.
</p>

${secretMessage}

<button onclick="location.reload()">
🔄 ابدأ من جديد
</button>

</div>
`;




}

}

function updateAchievement(){

let achievement =
document.getElementById("achievement");

if(completed >= 4){

achievement.innerHTML =
"🏆 بطل التعاطف";

}
else if(completed >= 2){

achievement.innerHTML =
"🥈 متفهم جيد";

}
else if(completed >= 1){

achievement.innerHTML =
"🥉 مبتدئ التعاطف";

}
else{

achievement.innerHTML = "";

}

}
function resetProgress(){

localStorage.removeItem("completed");
localStorage.removeItem("points");

completed = 0;
points = 0;

document.getElementById("completed").innerText = 0;
document.getElementById("points").innerText = 0;

document.getElementById("achievement").innerHTML = "" 


}
function chooseCharacter(character){

userCharacter = character;

localStorage.setItem(
"character",
character
);

}
if('serviceWorker' in navigator){
window.addEventListener('load',function(){
navigator.serviceWorker.register('sw.js').catch(function(){});
});
}

</script>

</body>
</html>
